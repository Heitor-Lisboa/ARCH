<!DOCTYPE html>
{% load static %}
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ARCH - LabMAKER{% endblock %}</title>
   
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="brand">
                <h1>ARCH</h1>
            </div>

            <div class="sidebar-search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Procure por abas">
            </div>

            <nav class="sidebar-nav">
                <ul>
                    <li>
                        <a href="#"><i class="fa-solid fa-house"></i> <span>Menu inicial</span> <i class="fa-solid fa-chevron-right arrow"></i></a>
                    </li>
                    <li>
                        <a href="#"><i class="fa-solid fa-right-left"></i> <span>Movimentações</span> <i class="fa-solid fa-chevron-right arrow"></i></a>
                    </li>
                    <li class="{% if request.resolver_match.url_name == 'estoque' %}active{% endif %}">
                        <a href="{% url 'estoque' %}"><i class="fa-solid fa-box"></i> <span>Estoque</span> <i class="fa-solid fa-chevron-right arrow"></i></a>
                    </li>
                    <li class="{% if request.resolver_match.url_name == 'autorizados' %}active{% endif %}">
                        <a href="{% url 'autorizados' %}"><i class="fa-solid fa-user-shield"></i> <span>Autorizados</span> <i class="fa-solid fa-chevron-right arrow"></i></a>
                    </li>
                </ul>   
            </nav>
        </aside>
        
         <main class="main-content">
            <header class="topbar">
                <h2 class="page-title">{% block page_title %}Estoque do LabMAKER{% endblock %}</h2>
                <div class="user-profile">
        
<label class="switch" for="switch">
    <input id="switch" type="checkbox" class="circle">

    <svg
        viewBox="0 0 384 512"
        xmlns="http://www.w3.org/2000/svg"
        class="moon svg"
        aria-hidden="true"
    >
        <path d="M223.5 32C100 32 0 132.3 0 256S100 480 223.5 480c60.6 0 115.5-24.2 155.8-63.4c5-4.9 6.3-12.5 3.1-18.7s-10.1-9.7-17-8.5c-9.8 1.7-19.8 2.6-30.1 2.6c-96.9 0-175.5-78.8-175.5-176c0-65.8 36-123.1 89.3-153.3c6.1-3.5 9.2-10.5 7.7-17.3s-7.3-11.9-14.3-12.5c-6.3-.5-12.6-.8-19-.8z"/>
    </svg>

    <div class="sun svg" aria-hidden="true">
        <span class="dot"></span>
    </div>
</label>
                    <button class="btn-icon" title="Notificações"><i class="fa-regular fa-bell"></i></button>
                    <div class="avatar">
                            <i class="fa-solid fa-user"></i>
                    </div>
                </div>
            </header>

            {% block content %}
            {% endblock %}
        </main>
    </div>
</body>
</html>
