<!DOCTYPE html>
{% load static %}
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ARCH - LabMAKER{% endblock %}</title>
   
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="brand">
                <h1>ARCH</h1>
            </div>

            <div class="sidebar-search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Procure por abas">
            </div>

            <nav class="sidebar-nav">
                <ul>
                    <li>
                        <a href="#"><i class="fa-solid fa-house"></i> <span>Menu inicial</span> <i class="fa-solid fa-chevron-right arrow"></i></a>
                    </li>
                    <li>
                        <a href="#"><i class="fa-solid fa-right-left"></i> <span>Movimentações</span> <i class="fa-solid fa-chevron-right arrow"></i></a>
                    </li>
                    <li class="{% if request.resolver_match.url_name == 'estoque' %}active{% endif %}">
                        <a href="{% url 'estoque' %}"><i class="fa-solid fa-box"></i> <span>Estoque</span> <i class="fa-solid fa-chevron-right arrow"></i></a>
                    </li>
                    <li class="{% if request.resolver_match.url_name == 'autorizados' %}active{% endif %}">
                        <a href="{% url 'autorizados' %}"><i class="fa-solid fa-user-shield"></i> <span>Autorizados</span> <i class="fa-solid fa-chevron-right arrow"></i></a>
                    </li>
                </ul>   
            </nav>
        </aside>
        
         <main class="main-content">
            <header class="topbar">
                <h2 class="page-title">{% block page_title %}Estoque do LabMAKER{% endblock %}</h2>
                <div class="user-profile">
                    <button class="btn-icon" title="Notificações"><i class="fa-regular fa-bell"></i></button>
                    <div class="avatar">
                        <i class="fa-solid fa-user"></i>
                    </div>
                </div>
            </header>

            {% block content %}
            {% endblock %}
        </main>
    </div>
</body>
</html>
