<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARCH - Usuários Autorizados</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand">
                <h1>ARCH</h1>
            </div>

            <div class="sidebar-search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Procure por abas">
            </div>

            <nav class="sidebar-nav">
                <ul>
                    <li>
                        <a href="#"><i class="fa-solid fa-house"></i> <span>Menu inicial</span> <i class="fa-solid fa-chevron-right arrow"></i></a>
                    </li>
                    <li>
                        <a href="#"><i class="fa-solid fa-right-left"></i> <span>Movimentações</span> <i class="fa-solid fa-chevron-right arrow"></i></a>
                    </li>
                    <li>
                        <a href="{% url 'estoque' %}"><i class="fa-solid fa-box"></i> <span>Estoque</span> <i class="fa-solid fa-chevron-right arrow"></i></a>
                    </li>
                    <li class="active">
                        <a href= "{% url 'autorizados' %}" ><i class="fa-solid fa-user-shield"></i> <span>Autorizados</span> <i class="fa-solid fa-chevron-right arrow"></i></a>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- Conteúdo Principal Placeholder -->
        <main class="main-content">
            <header class="topbar">
                <h2 class="page-title">Usuários Autorizados</h2>
                <div class="user-profile">
                    <button class="btn-icon" title="Notificações"><i class="fa-regular fa-bell"></i></button>
                    <div class="avatar">
                        <i class="fa-solid fa-user"></i>
                    </div>
                </div>
            </header>

            <section class="table-card" style="display: flex; justify-content: center; align-items: center; text-align: center; min-height: 300px;">
                <div class="placeholder-box">
                    <i class="fa-solid fa-id-card-clip" style="font-size: 48px; color: #6a1b9a; margin-bottom: 15px;"></i>
                    <h3>Verificação Automática via SUAP</h3>
                    <p style="margin-top: 8px; color: #555;">
                        A lista de usuários autorizados (bolsistas de projetos ativos e coordenadores do LabMAKER) será validada dinamicamente com a API do SUAP.
                    </p>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
