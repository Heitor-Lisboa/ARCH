{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ARCH</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/usuarios.css' %}">

    <link rel="stylesheet" id="theme-stylesheet"
          href="{% static 'css/themes/light.css' %}"
          data-light-url="{% static 'css/themes/light.css' %}"
          data-dark-url="{% static 'css/themes/dark.css' %}">
    <script src="{% static 'js/base.js' %}"></script>
</head>
<body class="login-page">
    <div class="login-card">
        <div class="login-brand">
            <h1>ARCH</h1>
            <p>Estoque do LabMAKER</p>
            <p>Entre com suas credenciais</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="login-alert">{{ message }}</div>
            {% endfor %}
        {% endif %}

        {% if erro %}
            <div class="login-alert">{{ erro }}</div>
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}

            <div class="login-field">
                <label for="username">Usuário</label>
                <div class="login-input-group">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="username" name="username" placeholder="Digite seu usuário" required autofocus>
                </div>
            </div>

            <div class="login-field">
                <label for="password">Senha</label>
                <div class="login-input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" name="password" placeholder="Digite sua senha" required>
                    <button type="button" class="login-eye-btn" id="btnVerSenha">
                        <i class="fa-solid fa-eye" id="iconeOlho"></i>
                    </button>
                </div>
            </div>

            <label class="login-remember">
                <input type="checkbox" id="lembrar" name="lembrar">
                Lembrar de mim
            </label>

            <button type="submit" class="login-submit">
                <i class="fa-solid fa-right-to-bracket"></i> Entrar
            </button>
        </form>

        <p class="login-footer">ARCH - Sistema de Estoque do LabMAKER (IFRN/SGA)</p>
    </div>

    <script src="{% static 'js/usuarios.js' %}"></script>
</body>
</html>
