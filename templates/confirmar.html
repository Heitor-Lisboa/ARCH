{% extends 'base.html' %}

{% block title %}ARCH - Confirmar exclusão{% endblock %}
{% block page_title %}Confirmar exclusão{% endblock %}

{% block content %}
<section class="form-card">
    <p class="confirm-text">Você vai excluir <strong>{{ nome }}</strong>. Esta ação não pode ser desfeita.</p>
    <form method="POST" class="form-actions">
        {% csrf_token %}
        <a href="{{ voltar }}" class="btn-secondary">Cancelar</a>
        <button type="submit" class="btn-download btn-danger"><i class="fa-solid fa-trash"></i> Excluir</button>
    </form>
</section>
{% endblock %}
